<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Fevi ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  width:100vw;
  height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"San Francisco",Arial;
  background:#fff;
  overflow:hidden;
  position:relative;
}

/* Border flashing lights */
.border{
  position:fixed;
  inset:0;
  border:10px solid red;
  animation:flash 1s infinite alternate;
  pointer-events:none;
  z-index:9999;
}

@keyframes flash{
  0%{border-color:red;}
  50%{border-color:green;}
  100%{border-color:red;}
}

/* Container */
.container{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
  transition: all 0.5s ease;
}

h1{
  color:#e60026;
  font-size:2rem;
  margin-bottom:40px;
  transition: 0.5s ease;
}

.buttons{
  display:flex;
  gap:20px;
}

button{
  border:none;
  border-radius:50px;
  padding:16px 30px;
  font-size:1.3rem;
  cursor:pointer;
  transition:0.4s ease;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
}
button:hover{
  transform:scale(1.1) rotate(-2deg);
}

#yes{
  background:#e60026;
  color:white;
  z-index:2;
}

#no{
  background:#ddd;
  z-index:1;
}

/* Heartbeat animation */
@keyframes heartbeat{
  0%,100%{transform: scale(1);}
  50%{transform: scale(1.2);}
}

/* Final text */
.finalText{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  font-size:2.5rem;
  color:white;
  flex-direction:column;
  z-index:99999;
  opacity:0;
  transition:1s ease;
}

/* Stickers */
.sticker{
  position:absolute;
  width:15px;
  height:15px;
  pointer-events:none;
  background-size:cover;
  z-index:9998;
}
</style>
</head>

<body>

<div class="border"></div>

<div class="container">
  <h1>Would you be my Valentine, Fevi? ❤️</h1>
  <div class="buttons">
    <button id="yes">Yes 💖</button>
    <button id="no">No 💔</button>
  </div>
</div>

<script>
const yes = document.getElementById("yes");
const no = document.getElementById("no");
const container = document.querySelector(".container");
let noCount = 0;

/* Add 500 love stickers at start */
for(let i=0;i<500;i++){
  const s = document.createElement("div");
  s.className="sticker";
  s.style.left=Math.random()*window.innerWidth+"px";
  s.style.top=Math.random()*window.innerHeight+"px";
  s.style.backgroundImage = Math.random()>0.5 ?
      "url('https://i.imgur.com/1pF6J9s.png')" : // pink heart
      "url('https://i.imgur.com/klT49nG.png')"; // red heart
  document.body.appendChild(s);
}

/* No button clicks */
no.onclick = () => {
  noCount++;
  no.style.transform = `scale(${1 - noCount*0.12}) rotate(${noCount*15}deg)`;
  yes.style.transform = `scale(${1 + noCount*0.1})`; // small growth

  if(noCount >=5){
    no.style.display="none";
    // Heartbeat effect
    yes.style.animation="heartbeat 1s infinite";
  }
};

/* Yes button click */
yes.onclick = () => {
  container.style.display="none";

  // Show final text
  const finalText = document.createElement("div");
  finalText.className="finalText";
  finalText.style.opacity=1;
  finalText.innerHTML="You are now my Valentine ❤️";
  document.body.appendChild(finalText);

  // Start party lights
  let colors=["#ff0000","#00ff00","#0000ff","#ffff00","#ff00ff","#00ffff"];
  let i=0;
  const party = setInterval(()=>{
    document.body.style.backgroundColor=colors[i%colors.length];
    i++;
  },300);

  // Optional: stop party after 15 seconds
  setTimeout(()=>clearInterval(party),15000);
};
</script>

</body>
</html>
