<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Fevi ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  width:100vw;
  height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"San Francisco",Arial;
  background:#fff;
  overflow:hidden;
  position:relative;
}

/* Border flashing lights */
.border{
  position:fixed;
  inset:0;
  border:10px solid red;
  animation:flash 1s infinite alternate;
  pointer-events:none;
  z-index:9999;
}

@keyframes flash{
  0%{border-color:red;}
  50%{border-color:green;}
  100%{border-color:red;}
}

/* Container */
.container{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
  transition: all 0.5s ease;
}

h1{
  color:#e60026;
  font-size:2rem;
  margin-bottom:40px;
  transition: 0.5s ease;
}

.buttons{
  display:flex;
  gap:20px;
}

button{
  border:none;
  border-radius:50px;
  padding:16px 30px;
  font-size:1.3rem;
  cursor:pointer;
  transition:0.4s ease;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
}
button:hover{
  transform:scale(1.1) rotate(-2deg);
}

#yes{
  background:#e60026;
  color:white;
  z-index:2;
}

#no{
  background:#ddd;
  z-index:1;
}

/* Final screen */
.final{
  position:fixed;
  inset:0;
  background:#e60026;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  font-size:2rem;
  flex-direction:column;
  z-index:99999;
  opacity:0;
  transition:1s ease;
}

/* iPhone popup */
.ios{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  max-width:360px;
  background:rgba(245,245,247,0.95);
  backdrop-filter:blur(20px);
  border-radius:22px;
  padding:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
  z-index:100000;
  text-align:left;
  opacity:0;
  transition:0.5s ease;
}

/* Stickers */
.sticker{
  position:absolute;
  width:20px;
  height:20px;
  pointer-events:none;
  background-size:cover;
  z-index:99998;
}
</style>
</head>

<body>

<div class="border"></div>

<div class="container">
  <h1>Would you be my Valentine, Fevi? ❤️</h1>
  <div class="buttons">
    <button id="yes">Yes 💖</button>
    <button id="no">No 💔</button>
  </div>
</div>

<script>
let noCount = 0;
const yes = document.getElementById("yes");
const no = document.getElementById("no");
const container = document.querySelector(".container");

/* No button logic */
no.onclick = () => {
  noCount++;
  no.style.transform = `scale(${1 - noCount*0.12}) rotate(${noCount*15}deg)`;
  yes.style.transform = `scale(${1 + noCount*0.35})`;

  if(noCount >= 5){
    no.style.display="none";
    yes.style.width="100vw";
    yes.style.height="100vh";
    yes.style.fontSize="2.5rem";
    yes.style.borderRadius="0";
  }
};

/* Yes button logic */
yes.onclick = () => {
  // Hide original container
  container.style.display="none";

  // Show final red screen
  const final = document.createElement("div");
  final.className="final";
  final.style.opacity=1;
  final.innerHTML="Now you are my Valentine ❤️<br>I love you baby 💕";
  document.body.appendChild(final);

  // Add love stickers
  for(let i=0;i<100;i++){
    const s = document.createElement("div");
    s.className="sticker";
    s.style.left=Math.random()*window.innerWidth+"px";
    s.style.top=Math.random()*window.innerHeight+"px";
    s.style.backgroundImage = Math.random()>0.5 ?
      "url('https://i.imgur.com/1pF6J9s.png')" : // pink heart
      "url('https://i.imgur.com/klT49nG.png')"; // red heart
    document.body.appendChild(s);
  }

  // Show iPhone popup after 5 seconds
  setTimeout(()=>{
    const pop = document.createElement("div");
    pop.className="ios";
    pop.style.opacity=1;
    pop.innerHTML="<strong>Messages</strong><br><b>Ollie ❤️</b><br>I love you shawty ❤️";
    document.body.appendChild(pop);
    setTimeout(()=>pop.remove(),8000);
  },5000);
};
</script>

</body>
</html>
