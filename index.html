<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Fevi ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  width:100vw;
  height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"San Francisco",Arial;
  background:#fff;
  overflow:hidden;
}

/* Glowing flower border animation */
.border-flower{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9997;
}

.container{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
  transition: all 0.5s ease;
}

h1{
  color:#e60026;
  font-size:2rem;
  margin-bottom:40px;
  animation:fadeSlide 1s ease forwards;
}

@keyframes fadeSlide{
  0%{opacity:0; transform:translateY(-50px);}
  100%{opacity:1; transform:translateY(0);}
}

.buttons{
  display:flex;
  gap:20px;
}

button{
  border:none;
  border-radius:50px;
  padding:16px 30px;
  font-size:1.3rem;
  cursor:pointer;
  transition:0.4s ease;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
}
button:hover{
  transform:scale(1.1) rotate(-2deg);
}

#yes{
  background:#e60026;
  color:white;
}

#no{
  background:#ddd;
}

/* iPhone popup */
.ios{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  max-width:360px;
  background:rgba(245,245,247,0.95);
  backdrop-filter:blur(20px);
  border-radius:22px;
  padding:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
  z-index:9999;
  text-align:left;
  animation:popupFade 0.5s ease;
}

@keyframes popupFade{
  0%{opacity:0; transform:translateY(-20px);}
  100%{opacity:1; transform:translateY(0);}
}

/* Final screen */
.final{
  position:fixed;
  inset:0;
  background:#e60026;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  font-size:2.5rem;
  z-index:99999;
  animation:fadeIn 0.8s ease;
}

@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}
</style>
</head>

<body>

<canvas class="border-flower"></canvas>

<div class="container">
  <h1>Would you be my Valentine, Fevi? ❤️</h1>
  <div class="buttons">
    <button id="yes">Yes 💖</button>
    <button id="no">No 💔</button>
  </div>
</div>

<script>
let noCount = 0;
const yes = document.getElementById("yes");
const no = document.getElementById("no");

/* Button interactions */
no.onclick = () => {
  noCount++;
  no.style.transform = `scale(${1 - noCount*0.12}) rotate(${noCount*10}deg)`;
  yes.style.transform = `scale(${1 + noCount*0.25})`;

  if(noCount >= 5){
    no.style.display="none";
    yes.style.width="90vw";
    yes.style.height="120px";
    yes.style.fontSize="1.6rem";
  }
};

yes.onclick = () => {
  flowerBomb();
  glowingFlowers();
  iphonePopup();

  setTimeout(()=>{
    const end=document.createElement("div");
    end.className="final";
    end.innerHTML="You are my Valentine ❤️<br>I love you baby 💕";
    document.body.appendChild(end);
  },4000);
};

/* iPhone popup */
function iphonePopup(){
  const pop=document.createElement("div");
  pop.className="ios";
  pop.innerHTML="<strong>Messages</strong><br><b>Ollie ❤️</b><br>I love you shawty ❤️";
  document.body.appendChild(pop);
  setTimeout(()=>pop.remove(),10000);
}
