<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Feven ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(#fff,#ffe6e6);
  font-family:-apple-system,BlinkMacSystemFont,"San Francisco",Arial;
}

.card{
  width:95%;
  max-width:380px;
  background:white;
  border-radius:25px;
  padding:20px;
  text-align:center;
  position:relative;
  overflow:hidden;
}

.card::before{
  content:"🌸 🌹 🌸 🌹 🌸 🌹";
  position:absolute;
  top:5px;
  width:100%;
  text-align:center;
}

h1{
  color:#e60026;
  font-size:1.7rem;
}

p{
  color:#555;
}

img{
  width:75%;
  max-width:240px;
  border-radius:20px;
  margin:15px 0;
  transition:0.5s ease;
}

.buttons{
  display:flex;
  gap:15px;
  justify-content:center;
}

button{
  border:none;
  border-radius:30px;
  padding:12px 22px;
  font-size:1.1rem;
  transition:0.4s ease;
}

#yes{
  background:#e60026;
  color:white;
}

#no{
  background:#ddd;
}

#msg{
  margin-top:15px;
  min-height:35px;
  font-size:1.1rem;
  color:#e60026;
}
</style>
</head>

<body>

<div class="card">
  <h1>Will you be my Valentine? ❤️</h1>
  <p>Fevi 🌹</p>

  <!-- YOUR PIC FIRST -->
  <img id="mainImg" src="me.jpg">

  <div class="buttons">
    <button id="yes">Yes 💖</button>
    <button id="no">No 💔</button>
  </div>

  <div id="msg"></div>
</div>

<!-- MUSIC -->
<audio id="music">
  <source src="perfect.mp3" type="audio/mpeg">
</audio>

<script>
let noCount = 0;
const sadCats = [
  "https://i.imgur.com/1X5qX8y.png",
  "https://i.imgur.com/Uw1ZKZP.png",
  "https://i.imgur.com/rZpG4Hk.png"
];

document.getElementById("no").onclick = () => {
  noCount++;
  document.getElementById("msg").innerText = "Fevi don’t break my heart 💔";
  document.getElementById("mainImg").src =
    sadCats[noCount % sadCats.length];

  document.getElementById("no").style.transform="scale(0.75)";
  document.getElementById("yes").style.transform=`scale(${1+noCount*0.25})`;

  if(noCount>=2){
    document.getElementById("no").style.display="none";
    document.getElementById("yes").style.width="100%";
  }
};

document.getElementById("yes").onclick = () => {
  document.getElementById("msg").innerText =
    "Thanks for being my Valentine ❤️ I love you";

  document.getElementById("mainImg").src="her.jpg";
  document.getElementById("music").play();
  confetti();
};

function confetti(){
  const c=document.createElement("canvas");
  document.body.appendChild(c);
  c.style.position="fixed";
  c.style.top=0;c.style.left=0;
  c.width=innerWidth;c.height=innerHeight;
  const ctx=c.getContext("2d");

  let pieces=[...Array(120)].map(()=>({
    x:Math.random()*c.width,
    y:Math.random()*c.height,
    r:Math.random()*6+4,
    d:Math.random()*c.height,
    color:["#e60026","#ff4d6d","#ff99aa"]
      [Math.floor(Math.random()*3)]
  }));

  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    pieces.forEach(p=>{
      ctx.fillStyle=p.color;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
      p.y+=3;
      if(p.y>c.height)p.y=0;
    });
    requestAnimationFrame(draw);
  }
  draw();
}
</script>

</body>
</html>
