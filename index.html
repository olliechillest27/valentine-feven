<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Fevi ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  width:100vw;
  height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"San Francisco",Arial;
  background:#fff;
  overflow:hidden;
}

/* Flashing bulb border */
.border{
  position:fixed;
  inset:0;
  border:10px solid red;
  animation:flash 1s infinite alternate;
  pointer-events:none;
}

@keyframes flash{
  0%{border-color:red;}
  100%{border-color:green;}
}

.container{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

h1{
  color:#e60026;
  font-size:2rem;
  margin-bottom:40px;
}

.buttons{
  display:flex;
  gap:20px;
}

button{
  border:none;
  border-radius:50px;
  padding:16px 30px;
  font-size:1.3rem;
  transition:0.4s ease;
}

#yes{
  background:#e60026;
  color:white;
}

#no{
  background:#ddd;
}

/* iPhone popup */
.ios{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  max-width:360px;
  background:rgba(245,245,247,0.95);
  backdrop-filter:blur(20px);
  border-radius:22px;
  padding:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
  z-index:9999;
  text-align:left;
}

/* Final screen */
.final{
  position:fixed;
  inset:0;
  background:#e60026;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  font-size:2.5rem;
  z-index:99999;
  animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}
</style>
</head>

<body>

<div class="border"></div>

<div class="container">
  <h1>Would you be my Valentine, Fevi? ❤️</h1>
  <div class="buttons">
    <button id="yes">Yes 💖</button>
    <button id="no">No 💔</button>
  </div>
</div>

<script>
let noCount = 0;
const yes = document.getElementById("yes");
const no = document.getElementById("no");

no.onclick = () => {
  noCount++;

  no.style.transform = `scale(${1 - noCount*0.12})`;
  yes.style.transform = `scale(${1 + noCount*0.35})`;

  if(noCount >= 5){
    no.style.display="none";
    yes.style.width="90vw";
    yes.style.height="120px";
    yes.style.fontSize="1.6rem";
  }
};

yes.onclick = () => {
  flowerBomb();
  iphonePopup();

  setTimeout(()=>{
    const end=document.createElement("div");
    end.className="final";
    end.innerHTML="You are my Valentine ❤️<br>I love you baby 💕";
    document.body.appendChild(end);
  },4000);
};

function iphonePopup(){
  const pop=document.createElement("div");
  pop.className="ios";
  pop.innerHTML="<strong>Messages</strong><br><b>Ollie ❤️</b><br>I love you shawty ❤️";
  document.body.appendChild(pop);
  setTimeout(()=>pop.remove(),10000);
}

function flowerBomb(){
  const c=document.createElement("canvas");
  document.body.appendChild(c);
  c.style.position="fixed";
  c.style.inset=0;
  c.style.zIndex=9998;
  const ctx=c.getContext("2d");
  c.width=innerWidth;
  c.height=innerHeight;

  let f=[...Array(200)].map(()=>({
    x:Math.random()*c.width,
    y:Math.random()*c.height,
    r:Math.random()*8+4,
    color:["#ff4d6d","#ff99aa","#ffffff"]
      [Math.floor(Math.random()*3)]
  }));

  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    f.forEach(p=>{
      ctx.fillStyle=p.color;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
      p.y+=4;
      if(p.y>c.height)p.y=0;
    });
    requestAnimationFrame(draw);
  }
  draw();
}
</script>

</body>
</html>
