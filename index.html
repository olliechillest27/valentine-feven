<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Fevi ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  width:100vw;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"San Francisco",Arial;
}

.container{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

h1{
  color:#e60026;
  font-size:2rem;
  margin-bottom:40px;
}

.buttons{
  display:flex;
  gap:20px;
}

button{
  border:none;
  border-radius:40px;
  padding:16px 28px;
  font-size:1.2rem;
  transition:0.4s ease;
}

#yes{
  background:#e60026;
  color:white;
}

#no{
  background:#e0e0e0;
}

/* FULLSCREEN END */
.fullscreen-love{
  position:fixed;
  inset:0;
  background:#e60026;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:white;
  font-size:2.4rem;
  padding:30px;
  z-index:9999;
  animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}
</style>
</head>

<body>

<div class="container">
  <h1>Would you be my Valentine, Fevi? ❤️</h1>

  <div class="buttons">
    <button id="yes">Yes 💖</button>
    <button id="no">No 💔</button>
  </div>
</div>

<script>
let count = 0;
const yes = document.getElementById("yes");
const no = document.getElementById("no");

no.onclick = () => {
  count++;

  no.style.transform = `scale(${1 - count * 0.15})`;
  yes.style.transform = `scale(${1 + count * 0.35})`;

  if(count >= 3){
    no.style.display = "none";
    yes.style.width = "90vw";
    yes.style.height = "90px";
  }
};

yes.onclick = () => {
  const end = document.createElement("div");
  end.className = "fullscreen-love";
  end.innerHTML = "You are my Valentine ❤️<br>I love you baby 💕";
  document.body.appendChild(end);
};
</script>

</body>
</html>
